<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Forgot Password</h2>

      <form [formGroup]="form" (ngSubmit)="requestReset()">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Enter your email">
        </div>
        <div *ngIf="message" class="alert alert-success">{{ message }}</div>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        <button type="submit" class="btn btn-primary" [disabled]="submitted || form.invalid">
          {{ submitted ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    </div>
  </div>
</div>
