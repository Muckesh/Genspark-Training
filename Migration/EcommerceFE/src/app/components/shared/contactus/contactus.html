<div class="container mt-5">
  <h2>Contact Us</h2>
  <form (ngSubmit)="onSubmit()" #form="ngForm" *ngIf="!submitted">
    <div class="form-group mb-2">
      <label>Name</label>
      <input [(ngModel)]="contact.name" name="name" class="form-control" required />
    </div>

    <div class="form-group mb-2">
      <label>Email</label>
      <input [(ngModel)]="contact.email" name="email" type="email" class="form-control" required />
    </div>

    <div class="form-group mb-2">
      <label>Phone</label>
      <input [(ngModel)]="contact.phone" name="phone" class="form-control" required />
    </div>

    <div class="form-group mb-2">
      <label>Message</label>
      <textarea [(ngModel)]="contact.content" name="content" class="form-control" rows="4" required></textarea>
    </div>

    <div class="form-group mb-3">
      <re-captcha
        siteKey="6LdbVpUrAAAAALy5I2JT-O6rdiGW8rNTDZ9ZyitW"
        (resolved)="handleCaptcha($event)"
        required
      ></re-captcha>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <button class="btn btn-primary" type="submit">Submit</button>
  </form>

  <div *ngIf="submitted" class="alert alert-success">
    Thank you for contacting us!
  </div>

  <!-- Divider -->
  <hr class="my-4" />

  <!-- Contact List Section -->
  <div>
    <h4>Submitted Contacts</h4>
    <table class="table table-bordered table-striped mt-2" *ngIf="contacts.length > 0">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Message</th>
          <!-- <th>Action</th> -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of contacts; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ c.name }}</td>
          <td>{{ c.email }}</td>
          <td>{{ c.phone }}</td>
          <td>{{ c.content }}</td>
          <!-- <td>
            <button class="btn btn-sm btn-danger" (click)="deleteContact(c.id)">Delete</button>
          </td> -->
        </tr>
      </tbody>
    </table>

    <div *ngIf="contacts.length === 0" class="text-muted">No contacts yet.</div>
  </div>
</div>
