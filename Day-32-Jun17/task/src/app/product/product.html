<div class="card" style="width: 18rem;">
    <img class="card-img-top" [src]="product?.thumbnail" alt="">
    <div class="card-body">
        <h5 class="card-title">{{product?.title}}</h5>
        <p class="card-text">{{product?.description}}</p>
        <button class="btn btn-primary">Buy for {{product?.price | currency:"INR"}}</button>
    </div>
</div>
<div class="text-center mt-5" *ngIf="loading">
  <div class="spinner-border text-primary"></div>
</div>

<div class="text-center text-danger mt-4" *ngIf="product==null && error">
  <p>{{ error }}</p>
</div>
